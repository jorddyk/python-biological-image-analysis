name: Publish approved methods website
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/publish-methods-20260927.yml']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import selected owner-approved image exports
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io,json,urllib.request
          from pathlib import Path
          from PIL import Image,ImageOps
          sources={
           'aging-chip.jpg':'https://lh7-rt.googleusercontent.com/docsz/AD_4nXdZjKYj-jlB8BX3M9geIQvMZIzdDvitmssN8wUbL4ELEttgH_oAPhULZ3HClsIF4X0oaxHB5AUqmbXYuYt6u-jcjn2PHxpTGwOhAu3Hmn7Dmphzq5QtkLe6Mo1Zw0JWM3jRz5_PsEYmXuyoiTW93t7G4f6xSmLdhPawWCxxrtDH4pTjMTg=s2048?key=3f0PN9rXb6QTtTqVMPWHZQ',
           'mad-setup.jpg':'https://lh7-rt.googleusercontent.com/docsz/AD_4nXdLWbLvBkrb3iH2kyGNESo9v5VKc-n_ovd7o_h2TwRzNljxBQ94Y2cz79VCE--C1HToK0gw_C53hbn3MmkG0c4VaO-mS2N5g7HlIULhbS1jfmOL-P-ECUCCaZpCF_JlqXLjj8li4aF1ochdHQf4eNdVNLkL0mdYk_J_A8gmqPdvdIG5PrI=s2048?key=3f0PN9rXb6QTtTqVMPWHZQ',
           'mad-controls.jpg':'https://lh7-rt.googleusercontent.com/docsz/AD_4nXeb1hM0z06ucHvOsTeUTqXgomt7044xRz1mb76jtc9zOxi99udpOpVbTTJ79tT1lPcKM3XtA_fwGf6PVuZyU2JrL7TJPyFRpX8DviX7zaSGb_UcSiSLm6HmnFJRN8Gq4FASI7Ec5thLhAWUusUy9Rr6cy3bQ-mEF6lE-zg3iS08zbtUZz8=s2048?key=3f0PN9rXb6QTtTqVMPWHZQ'
          }
          prepared={}
          for name,url in sources.items():
              with urllib.request.urlopen(url,timeout=40) as r:
                  raw=r.read(8000000)
              image=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
              if min(image.size)<600:
                  raise SystemExit('Image export unexpectedly small; stopping.')
              if name=='aging-chip.jpg' and image.width!=image.height:
                  raise SystemExit('Unexpected microscopy-frame geometry.')
              if name!='aging-chip.jpg' and image.height<=image.width:
                  raise SystemExit('Unexpected apparatus-image orientation.')
              image.thumbnail((1400,1600))
              output=io.BytesIO();image.save(output,format='JPEG',quality=88,optimize=True)
              prepared[name]=output.getvalue()
              print(json.dumps({'image':name,'pixels':image.size,'bytes':len(prepared[name])}))
          for name,raw in prepared.items():
              Path('assets',name).write_bytes(raw)
          PY
      - name: Apply reviewed public text and domain metadata
        run: python .github/publish-methods.py
      - name: Commit approved public content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html robots.txt sitemap.xml WEBSITE-NOTES.md release-checksums.json assets/aging-chip.jpg assets/mad-setup.jpg assets/mad-controls.jpg
          git commit -m 'Publish approved aging-chip and MAD images with accessible research and contact sections'
          git push origin HEAD:gh-pages
      - name: Assemble website-only deployment
        run: |
          mkdir -p _site/assets
          cp index.html robots.txt sitemap.xml CNAME .nojekyll WEBSITE-NOTES.md release-checksums.json _site/
          cp assets/portrait.jpg assets/aging-chip.jpg assets/mad-setup.jpg assets/mad-controls.jpg _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: jordan-website-approved-methods
          path: _site/
          include-hidden-files: true
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy personal research website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live domain and published images
        run: |
          python - <<'PY'
          import urllib.request,json,time,hashlib
          from pathlib import Path
          base='https://jordanmccarthy.com/'
          report={'url':base,'verified':False}
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'release-checksums.json',timeout=15) as r:
                      manifest=json.load(r)
                  checks={}
                  for name,expected in manifest.items():
                      with urllib.request.urlopen(base+name+'?methods=20260927',timeout=15) as r:
                          content=r.read(3000000)
                          checks[name]={'http':r.status,'hash_matches':hashlib.sha256(content).hexdigest()==expected}
                  report['checks']=checks
                  report['verified']=all(x['http']==200 and x['hash_matches'] for x in checks.values())
                  if report['verified']:break
              except Exception as e:
                  report['last_error']=str(e)
              time.sleep(5)
          Path('deployment-verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report['verified']:
              raise SystemExit('Deployment completed but live verification failed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-website-deployment-verification
          path: deployment-verification.json
          retention-days: 7
