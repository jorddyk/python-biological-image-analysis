name: Verify published attention layout
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/verify-attention-release.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing live deployment without deploying again
        run: |
          python - <<'PY'
          import urllib.request, hashlib, json, time, datetime
          from pathlib import Path
          names=['index.html','assets/attention-layout.css','assets/portrait-editorial-lake.jpg','assets/portrait-editorial-lake.webp','assets/portrait-editorial-lake-400.webp','assets/aging-chip.jpg','assets/mad-setup.jpg','assets/mad-controls.jpg']
          expected={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}
          assert expected['index.html']=='9edc265c553d2c5f3505338955ee29dab4da45bafcc111640a5896e51330e240'
          report={'url':'https://jordanmccarthy.com/','verified':False,'measured_gaze':False}
          for attempt in range(10):
              try:
                  checks={}
                  for name in names:
                      request=urllib.request.Request(report['url']+name+'?verification=attention-final',headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=12) as response:
                          content=response.read(7000000)
                          checks[name]={'http_status':response.status,'sha256':hashlib.sha256(content).hexdigest(),'hash_matches':hashlib.sha256(content).hexdigest()==expected[name]}
                  report['checks']=checks
                  report['verified']=all(x['http_status']==200 and x['hash_matches'] for x in checks.values())
                  if report['verified']:break
              except Exception as e:
                  report['last_error']=str(e)
              time.sleep(5)
          report['verified_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          Path('attention-release-verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report['verified']:raise SystemExit('Live release could not yet be verified.')
          notes=Path('WEBSITE-NOTES.md')
          text=notes.read_text()
          text=text.replace('Simola et al. (2014), DOI 10.3389/fpsyg.2014.00166','Sajjacholapunt & Ball (2014), DOI 10.3389/fpsyg.2014.00166')
          notes.write_text(text)
          manifest=json.loads(Path('release-checksums.json').read_text())
          manifest['WEBSITE-NOTES.md']=hashlib.sha256(notes.read_bytes()).hexdigest()
          Path('release-checksums.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Retain verification and remove completed verifier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/verification
          cp attention-release-verification.json .github/verification/attention-release.json
          git add WEBSITE-NOTES.md release-checksums.json .github/verification/attention-release.json
          git rm .github/workflows/verify-attention-release.yml
          git commit -m 'Verify live portrait/layout/assets and correct cited study authors'
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-attention-verification
          path: attention-release-verification.json
          retention-days: 7
