name: Final portrait-caption and collaboration review
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/final-caption-review.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Apply only the requested portrait-text removal
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,re,shutil
          assert subprocess.check_output(['git','hash-object','index.html'],text=True).strip()=='55cbccc4a81c799e15dfb8d55b00d6b8eb2b6c24', 'Homepage changed; stopping without overwriting it.'
          assert Path('CNAME').read_text().strip()=='jordanmccarthy.com'
          old=Path('index.html').read_text()
          baseline='8b5ca5e4ba5e7e6fbc819314ba54ffb21ae5a824'
          evidence=Path('_evidence');evidence.mkdir(exist_ok=True)
          site=Path('_baseline');site.mkdir(exist_ok=True)
          shutil.copytree('assets',site/'assets',dirs_exist_ok=True)
          for name in ['index.html','assets/attention-layout.css']:
              (site/name).write_bytes(subprocess.check_output(['git','show',baseline+':'+name]))
          changes={
            '<span>Digitally edited portrait</span>':'',
            'alt="Digitally edited portrait of Jordan McCarthy beside a lake at sunset"':'alt="Portrait of Jordan McCarthy beside a lake at sunset"',
            'content="Digitally edited portrait of Jordan McCarthy"':'content="Portrait of Jordan McCarthy"',
            'The homepage portrait was digitally edited using owner-provided photographs, including changes to expression, clothing silhouette and background. It is not an unaltered documentary photograph. ':'',
            'Sources, portrait &amp; site notes':'Sources &amp; site notes'
          }
          new=old
          for a,b in changes.items():
              assert new.count(a)==1, 'Unexpected text count; refusing a broad replacement.'
              new=new.replace(a,b,1)
          assert 'digitally edited' not in new.lower()
          for section in ['work','research','methods','contact','about']:
              pattern=r'<section[^>]*id="'+section+r'"[^>]*>.*?</section>'
              assert re.search(pattern,old,re.S).group()==re.search(pattern,new,re.S).group(),section
          Path('index.html').write_text(new)
          manifest=json.loads(Path('release-checksums.json').read_text())
          manifest['index.html']=hashlib.sha256(new.encode()).hexdigest()
          Path('release-checksums.json').write_text(json.dumps(manifest,indent=2))
          (evidence/'change-summary.json').write_text(json.dumps({'baseline_commit':baseline,'source_before_caption_removal':'8bb580eaea0f4a3d5eec66ffc997cbf79300f0b5','changed_content_files':['index.html','release-checksums.json'],'portrait_bytes_unchanged':True,'research_and_collaboration_sections_unchanged':True,'new_html_sha256':manifest['index.html']},indent=2))
          PY
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Verify desktop, mobile and email fallbacks; capture before and after
        run: |
          python - <<'PY'
          import http.server,threading,json,functools
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from playwright.sync_api import sync_playwright
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          srv=http.server.ThreadingHTTPServer(('127.0.0.1',8765),functools.partial(Quiet,directory='.'))
          threading.Thread(target=srv.serve_forever,daemon=True).start()
          report={'measured_visitor_gaze':False,'measured_conversion_lift':False,'viewports':[],'before':{},'after':{}}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for stage,path in [('before','_baseline/'),('after','')]:
                  out=Path('_evidence')/stage;out.mkdir(exist_ok=True)
                  for width,height in [(320,812),(390,844),(760,900),(1024,900),(1440,1000)]:
                      page=browser.new_page(viewport={'width':width,'height':height})
                      errors=[];external=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.on('request',lambda r:external.append(r.url) if not r.url.startswith(('http://127.0.0.1:8765/','data:')) else None)
                      page.goto('http://127.0.0.1:8765/'+path,wait_until='networkidle')
                      page.evaluate("document.querySelectorAll('img').forEach(i=>i.loading='eager')")
                      page.wait_for_function('Array.from(document.images).every(i=>i.complete && i.naturalWidth>0)')
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),('overflow',stage,width)
                      boxes={k:page.locator('#'+k).bounding_box() for k in ['work','research','methods','contact']}
                      primary=page.locator('.hero .action-primary')
                      box=primary.bounding_box()
                      measures={'document_height':page.evaluate('document.documentElement.scrollHeight'),'section_y':{k:round(v['y'],1) for k,v in boxes.items()},'primary_action_bottom':round(box['y']+box['height'],1),'primary_action_font_px':page.locator('.hero .action-primary').evaluate('(e)=>parseFloat(getComputedStyle(e).fontSize)')}
                      report[stage][str(width)]=measures
                      page.screenshot(path=str(out/f'{width}-first.png'))
                      page.screenshot(path=str(out/f'{width}-full.png'),full_page=True)
                      if stage=='after':
                          assert 'digitally edited' not in page.locator('body').inner_text().lower()
                          assert primary.get_attribute('href')=='#contact'
                          assert box['height']>=44 and measures['primary_action_font_px']>=16
                          if width==390:assert box['y']+box['height']<=844,'Collaboration action is not on the first screen.'
                          assert boxes['work']['y']<boxes['methods']['y']
                          assert page.locator('.contribution-visible').is_visible()
                          primary.click();page.wait_for_timeout(700)
                          assert page.url.endswith('#contact')
                          assert page.locator('#contact').bounding_box()['y']>=0
                          mail=page.locator('#contact a[href^="mailto:"]').first.get_attribute('href')
                          parsed=urlsplit(mail);query=parse_qs(parsed.query)
                          assert parsed.path=='jordan.mccarthy@bc.biol.ethz.ch'
                          assert 'collaboration' in query['subject'][0].lower()
                          body=query['body'][0].lower()
                          assert 'question' in body and 'system' in body and 'measurement' in body
                          assert 'non-confidential' in body
                          assert page.locator('#contact-email').inner_text().strip()=='jordan.mccarthy@bc.biol.ethz.ch'
                          # Mock clipboard responses test both paths without sending an email.
                          page.evaluate("Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async(t)=>{window.testCopied=t;}}})")
                          page.locator('.copy-email').click();page.wait_for_timeout(50)
                          assert page.evaluate('window.testCopied')=='jordan.mccarthy@bc.biol.ethz.ch'
                          assert 'copied' in page.locator('#email-copy-status').inner_text().lower()
                          page.evaluate("Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async()=>{throw new Error('blocked')}}})")
                          page.locator('.copy-email').click();page.wait_for_timeout(50)
                          assert 'unavailable' in page.locator('#email-copy-status').inner_text().lower()
                          if width<=760:
                              page.locator('.menu-toggle').click();assert page.locator('.menu-toggle').get_attribute('aria-expanded')=='true'
                              page.keyboard.press('Escape');assert page.locator('.menu-toggle').get_attribute('aria-expanded')=='false'
                              page.locator('.menu-toggle').click();page.locator('#navigation a[href="#methods"]').click()
                              assert page.locator('.menu-toggle').get_attribute('aria-expanded')=='false'
                          page.locator('.speaking summary').click();assert page.locator('.speaking').get_attribute('open') is not None
                          page.emulate_media(reduced_motion='reduce')
                          assert page.evaluate('getComputedStyle(document.documentElement).scrollBehavior')=='auto'
                          assert not errors,errors
                          assert not external,external
                          report['viewports'].append({'width':width,'horizontal_overflow':False,'images_loaded':True,'email_encoding':True,'clipboard_success_and_failure':True,'anchor_navigation':True,'reduced_motion':True,'javascript_errors':errors,'external_requests':external})
                      page.close()
              nojs=browser.new_page(viewport={'width':390,'height':844},java_script_enabled=False)
              nojs.goto('http://127.0.0.1:8765/',wait_until='networkidle')
              assert nojs.locator('.hero .action-primary').is_visible()
              nojs.locator('.hero .action-primary').click()
              assert nojs.url.endswith('#contact') and nojs.locator('#contact-email').is_visible()
              assert nojs.locator('#contact a[href^="mailto:"]').first.is_visible()
              nojs.screenshot(path='_evidence/after/390-no-js.png',full_page=True)
              report['no_javascript_contact_access']=True
              nojs.close();browser.close()
          srv.shutdown()
          Path('_evidence/tests.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Commit the caption-only change on the publishing branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html release-checksums.json
          git rm .github/workflows/final-caption-review.yml
          git commit -m 'Remove portrait-editing caption while preserving the collaboration upgrade'
          git push origin HEAD:gh-pages
          git rev-parse HEAD > _evidence/deployed-commit.txt
      - name: Verify the native Pages deployment on the custom domain
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,time,datetime
          from pathlib import Path
          base='https://jordanmccarthy.com/'
          expected=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          report={'url':base,'expected_html_sha256':expected,'commit':Path('_evidence/deployed-commit.txt').read_text().strip(),'verified':False}
          for i in range(28):
              try:
                  with urllib.request.urlopen(base+'?release=final-caption-review',timeout=12) as r:
                      data=r.read(2000000)
                      match=r.status==200 and hashlib.sha256(data).hexdigest()==expected
                  if match:
                      checked={}
                      for name in ['assets/attention-layout.css','assets/portrait-editorial-lake.jpg','assets/portrait-editorial-lake-400.webp','assets/aging-chip.jpg','assets/mad-setup.jpg','assets/mad-controls.jpg','robots.txt','sitemap.xml']:
                          with urllib.request.urlopen(base+name,timeout=15) as r:
                              raw=r.read(7000000)
                              checked[name]={'http_status':r.status,'hash_matches':hashlib.sha256(raw).hexdigest()==hashlib.sha256(Path(name).read_bytes()).hexdigest()}
                      report.update({'assets':checked,'verified':all(x['http_status']==200 and x['hash_matches'] for x in checked.values()),'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
                      if report['verified']:break
              except Exception as e:report['last_error']=str(e)
              time.sleep(6)
          Path('_evidence/live-verification.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          if not report['verified']:raise SystemExit('Source updated but live verification did not complete.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-final-review
          path: _evidence/
          retention-days: 7
